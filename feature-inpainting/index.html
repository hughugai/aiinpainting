<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>特征优先块匹配 · 论文复现</title>
<style>body{margin:0;background:#f3f5f8;color:#182433;font:15px system-ui}main{max-width:1100px;margin:36px auto;padding:0 24px}h1{font-size:28px}p{color:#586678;line-height:1.7}.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:white;padding:18px;border-radius:12px}button{border:0;border-radius:7px;padding:10px 15px;background:#225acb;color:white;cursor:pointer}input[type=number]{width:65px;padding:7px}section{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}article{background:white;padding:18px;border-radius:12px}canvas{max-width:100%;height:auto;background:#e7ecf2;touch-action:none}#status{min-height:25px}a{color:#225acb}@media(max-width:700px){section{grid-template-columns:1fr}}</style>
<main><h1>特征优先块匹配图像修复</h1><p>上传图片，在左侧涂抹待修复区域。白色掩码表示缺失区域。全局 SSD 搜索适合先用小图验证；本演示将输入等比例缩至最长边 256 像素，结果也采用该尺寸。</p>
<div class="bar"><label>图片 <input id="file" type="file" accept="image/*"></label><button id="sample">载入样例</button><button id="clear">清除掩码</button><label>笔刷 <input id="brush" type="number" value="12" min="1" max="80"></label><label>块 <input id="patch" type="number" value="9" min="3" step="2"></label><label>λ <input id="lam" type="number" value="0.35" step="0.01"></label><label>特征权重 <input id="weight" type="number" value="1" step="0.5"></label><select id="method"><option value="feature">论文特征优先</option><option value="shifted">仅置信项偏移</option><option value="criminisi">Criminisi 基线</option></select><button id="run">开始修复</button><button id="cancel">取消</button></div>
<p id="status">尚未载入图片</p><section><article><h3>输入与掩码</h3><canvas id="input"></canvas></article><article><h3>修复结果</h3><canvas id="output"></canvas><p><a id="download" hidden download="restored.png">下载 PNG</a> · <a id="downloadMask" hidden download="mask.png">下载掩码</a></p></article></section></main>
<script type="module">
const $=id=>document.getElementById(id),canvas=$('input'),ctx=canvas.getContext('2d');let original,mask,w,h,worker,drawing=false,last;
function load(img){const scale=Math.min(1,256/Math.max(img.width,img.height));w=Math.round(img.width*scale);h=Math.round(img.height*scale);canvas.width=w;canvas.height=h;ctx.drawImage(img,0,0,w,h);original=ctx.getImageData(0,0,w,h);mask=new Uint8Array(w*h);$('output').width=w;$('output').height=h;$('download').hidden=true;status(`已载入 ${w} × ${h}，请涂抹掩码`);render();}
function status(s){$('status').textContent=s;}
function render(){if(!original)return;const d=new ImageData(new Uint8ClampedArray(original.data),w,h);for(let i=0;i<mask.length;i++)if(mask[i]){d.data[i*4]=255;d.data[i*4+1]=Math.round(d.data[i*4+1]*.35);d.data[i*4+2]=Math.round(d.data[i*4+2]*.35);}ctx.putImageData(d,0,0);const c=document.createElement('canvas');c.width=w;c.height=h;const m=c.getContext('2d').createImageData(w,h);for(let i=0;i<mask.length;i++){m.data[i*4]=m.data[i*4+1]=m.data[i*4+2]=mask[i]*255;m.data[i*4+3]=255;}c.getContext('2d').putImageData(m,0,0);$('downloadMask').href=c.toDataURL();$('downloadMask').hidden=false;}
function point(e){const b=canvas.getBoundingClientRect();return [(e.clientX-b.left)*w/b.width,(e.clientY-b.top)*h/b.height];}
function paint(p){const r=Math.max(1,Number($('brush').value))/2;const start=last||p,len=Math.hypot(p[0]-start[0],p[1]-start[1]),steps=Math.max(1,Math.ceil(len));for(let s=0;s<=steps;s++){const x=start[0]+(p[0]-start[0])*s/steps,y=start[1]+(p[1]-start[1])*s/steps;for(let yy=Math.max(0,Math.floor(y-r));yy<Math.min(h,y+r+1);yy++)for(let xx=Math.max(0,Math.floor(x-r));xx<Math.min(w,x+r+1);xx++)if(Math.hypot(xx-x,yy-y)<=r)mask[yy*w+xx]=1;}last=p;render();}
canvas.onpointerdown=e=>{if(!original||worker)return;drawing=true;last=null;canvas.setPointerCapture(e.pointerId);paint(point(e));};canvas.onpointermove=e=>{if(drawing)paint(point(e));};canvas.onpointerup=canvas.onpointercancel=()=>{drawing=false;last=null;};
$('file').onchange=()=>{if(worker)return;const file=$('file').files[0];if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{load(img);URL.revokeObjectURL(url);};img.onerror=()=>{status('无法读取图片');URL.revokeObjectURL(url);};img.src=url;};
$('sample').onclick=()=>{if(worker)return;const img=new Image();img.onload=()=>{load(img);for(let y=17;y<30;y++)for(let x=26;x<39;x++)mask[y*w+x]=1;render();};img.src='examples/original.png';};
$('clear').onclick=()=>{if(mask&&!worker){mask.fill(0);render();}};
$('cancel').onclick=()=>{if(worker){worker.terminate();worker=null;$('run').disabled=false;status('已取消');}};
$('run').onclick=()=>{if(!original||worker)return;if(!mask.some(Boolean)){status('请先绘制待修复区域');return;}const rgb=new Uint8Array(w*h*3);for(let i=0;i<w*h;i++)for(let c=0;c<3;c++)rgb[3*i+c]=original.data[4*i+c];worker=new Worker('./worker.js',{type:'module'});$('run').disabled=true;status('正在计算…');worker.onmessage=({data:d})=>{if(d.progress!==undefined){status(`剩余 ${d.progress} 像素`);return;}worker.terminate();worker=null;$('run').disabled=false;if(d.error){status(d.error);return;}const out=new ImageData(w,h);for(let i=0;i<w*h;i++){for(let c=0;c<3;c++)out.data[4*i+c]=d.result.image[3*i+c];out.data[4*i+3]=255;}$('output').getContext('2d').putImageData(out,0,0);$('download').href=$('output').toDataURL();$('download').hidden=false;status(`完成 ${d.result.trace.length} 次块填充`);};worker.onerror=e=>{worker.terminate();worker=null;$('run').disabled=false;status(e.message);};worker.postMessage({rgb,mask,width:w,height:h,options:{patch:Number($('patch').value),lambda:Number($('lam').value),featureWeight:Number($('weight').value),method:$('method').value}});};
</script></html>
